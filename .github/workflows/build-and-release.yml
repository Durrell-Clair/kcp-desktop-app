name: Build and Release

on:
  push:
    branches:
      - main  # Déclenche sur push vers main
    tags:
      - 'v*.*.*'  # Déclenche aussi sur les tags de version (ex: v1.0.0)

jobs:
  # Job pour générer la version et créer le tag (uniquement pour push vers main)
  generate-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      tag_name: ${{ steps.generate_version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version from date
        id: generate_version
        run: |
          # Générer une version basée sur la date et l'heure
          # Format: vYYYY.MM.DD.HHmm
          VERSION=$(date +'%Y.%m.%d.%H%M')
          TAG_NAME="v$VERSION"
          
          # Vérifier si le tag existe déjà (peu probable mais possible)
          COUNTER=0
          while git rev-parse "$TAG_NAME" >/dev/null 2>&1; do
            COUNTER=$((COUNTER + 1))
            VERSION=$(date +'%Y.%m.%d.%H%M')".$COUNTER"
            TAG_NAME="v$VERSION"
          done
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated version: $TAG_NAME"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.generate_version.outputs.tag_name }}" -m "Auto-release: ${{ steps.generate_version.outputs.tag_name }}"
          git push origin "${{ steps.generate_version.outputs.tag_name }}"

  build:
    # S'exécuter après generate-version (qui peut être skipped pour les tags)
    needs: [generate-version]
    if: |
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.generate-version.result == 'success') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      )
    runs-on: ${{ matrix.os }}
    continue-on-error: true  # Continuer même si un build échoue
    strategy:
      fail-fast: false  # Ne pas arrêter tous les builds si un échoue
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
            build-flag: --win
          - os: ubuntu-latest
            platform: linux
            build-flag: --linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile
        continue-on-error: false

      - name: Build application
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building for ${{ matrix.platform }}..."
          npm run build -- ${{ matrix.build-flag }} --publish never
          echo "Build completed for ${{ matrix.platform }}"
        continue-on-error: true

      - name: List build artifacts
        if: always()
        run: |
          echo "Listing files in dist directory:"
          find dist -type f -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.rpm" || echo "No build artifacts found"
          ls -la dist/ || echo "dist directory not found"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.dmg
            dist/**/*.rpm
          if-no-files-found: warn  # Avertir si aucun fichier n'est trouvé
          retention-days: 30

  release:
    needs: [generate-version, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped'  # S'exécuter même si les builds échouent
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupérer tous les tags

      - name: Get version from tag or generated version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Version générée automatiquement (pour push vers main)
            if [ -n "${{ needs.generate-version.outputs.tag_name }}" ]; then
              VERSION="${{ needs.generate-version.outputs.tag_name }}"
            else
              # Fallback: générer depuis la date
              VERSION="v$(date +'%Y.%m.%d.%H%M')"
            fi
          else
            # Version depuis le tag poussé
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          
          # Si VERSION est vide, essayer de le récupérer depuis le contexte
          if [ -z "$VERSION" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-build
          path: dist/win
          if-no-files-found: ignore  # Ignorer si l'artifact n'existe pas

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux
          if-no-files-found: ignore  # Ignorer si l'artifact n'existe pas

      - name: Find release files
        id: find_files
        run: |
          echo "Searching for release files..."
          # Chercher tous les fichiers de release
          find dist -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.rpm" \) > release_files.txt || touch release_files.txt
          
          if [ -s release_files.txt ]; then
            echo "Found release files:"
            cat release_files.txt
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "No release files found"
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🎉 Release ${{ steps.get_version.outputs.VERSION }}

            ### 📦 Téléchargements

            **Windows:**
            - Installateur NSIS (.exe)

            **Linux:**
            - AppImage
            - Debian Package (.deb)

            ### 📝 Notes de version

            Consultez les [notes de version](https://github.com/Durrell-Clair/kcp-desktop-app/releases) pour plus de détails.

            ### 🔄 Installation

            Téléchargez le fichier correspondant à votre système d'exploitation et suivez les instructions d'installation.

            ---
            
            **Note:** Cette release a été créée automatiquement par GitHub Actions.
          files: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.dmg
            dist/**/*.rpm
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') || contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'rc') }}
          fail_on_unmatched_files: false  # Ne pas échouer si aucun fichier n'est trouvé
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: always()
        run: |
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            echo "✅ Release created successfully!"
            echo "Version: ${{ steps.get_version.outputs.VERSION }}"
            echo "Release URL: https://github.com/Durrell-Clair/kcp-desktop-app/releases/tag/${{ steps.get_version.outputs.VERSION }}"
          else
            echo "❌ Failed to create release"
            exit 1
          fi
